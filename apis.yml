- aid: mem0:platform-api
  name: Mem0 Platform API
  description: >-
    The Mem0 Platform API provides hosted memory services for AI agents, exposing endpoints for adding,
    searching, retrieving, updating, and deleting memories, plus entities, events, organizations, projects,
    and webhooks. The API is REST based and authenticated with a project API key.
