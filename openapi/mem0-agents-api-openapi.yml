openapi: 3.2.0
info:
  title: Mem0 API Docs Agents API
  description: mem0.ai API Docs
  contact:
    email: support@mem0.ai
  license:
    name: Apache 2.0
  version: v1
servers:
- url: https://api.mem0.ai/
security:
- ApiKeyAuth: []
tags:
- name: Agents
paths:
  /v1/agents/:
    post:
      tags:
      - Agents
      description: Create a new Agent.
      operationId: agents_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgent'
        required: true
      responses:
        '201':
          description: Agent created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
      x-codegen-request-body-name: data
      summary: Agents create
      x-summary-source: derived
components:
  schemas:
    AgentResponse:
      type: object
      description: Response returned after creating an Agent.
      properties:
        id:
          title: Id
          type: integer
          description: Internal numeric identifier.
        agent_id:
          title: Agent id
          type: string
        name:
          title: Name
          type: string
        metadata:
          title: Metadata
          type: object
          properties: {}
        created_at:
          title: Created at
          type: string
          format: date-time
        updated_at:
          title: Updated at
          type: string
          format: date-time
        graph_entities:
          title: Graph entities
          description: Graph entities linked to this record, if any.
        is_deleted:
          title: Is deleted
          type: boolean
        project:
          title: Project
          type: integer
          description: Internal numeric identifier of the project this record belongs to.
    CreateAgent:
      required:
      - agent_id
      - name
      type: object
      properties:
        agent_id:
          title: Agent id
          minLength: 1
          type: string
        name:
          title: Name
          minLength: 1
          type: string
        metadata:
          title: Metadata
          type: object
          properties: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication. Prefix your Mem0 API key with ''Token ''. Example: ''Token your_api_key'''
x-original-swagger-version: '2.0'
