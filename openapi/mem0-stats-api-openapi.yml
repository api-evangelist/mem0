openapi: 3.2.0
info:
  title: Mem0 API Docs Stats API
  description: mem0.ai API Docs
  contact:
    email: support@mem0.ai
  license:
    name: Apache 2.0
  version: v1
servers:
- url: https://api.mem0.ai/
security:
- ApiKeyAuth: []
tags:
- name: Stats
paths:
  /v1/stats/:
    get:
      tags:
      - Stats
      summary: Retrieve memory-related statistics for the authenticated user
      description: 'This endpoint returns the following statistics:

        - Total number of memories created

        - Total number of search events

        - Total number of add events'
      operationId: stats_list
      responses:
        '200':
          description: Successfully retrieved statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_memories:
                    type: integer
                  total_retrieval_events:
                    type: integer
                  total_add_events:
                    type: integer
                  total_api_retrieval_events:
                    type: integer
                  total_retrieval_events_limit:
                    type: integer
                  total_users_with_memories:
                    type: integer
                  total_agents_with_memories:
                    type: integer
                  total_runs_with_memories:
                    type: integer
                  memories_per_user:
                    type: integer
                  memories_per_agent:
                    type: integer
                  memories_per_run:
                    type: integer
  /v1/ping/:
    get:
      tags:
      - Stats
      summary: Check API key validity and resolve organization/project context
      description: Both the Python and TypeScript SDKs call this endpoint on client construction to validate the API key and resolve the default `org_id` and `project_id`.
      operationId: ping_read
      responses:
        '200':
          description: The API key is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  org_id:
                    type: string
                  project_id:
                    type: string
                  user_email:
                    type: string
                    format: email
        '401':
          description: Invalid API key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Invalid API key. You can find your API key on https://app.mem0.ai/dashboard/api-keys.
      x-code-samples:
      - lang: cURL
        source: "curl --request GET \\\n  --url https://api.mem0.ai/v1/ping/ \\\n  --header 'Authorization: Token <api-key>'"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication. Prefix your Mem0 API key with ''Token ''. Example: ''Token your_api_key'''
x-original-swagger-version: '2.0'
