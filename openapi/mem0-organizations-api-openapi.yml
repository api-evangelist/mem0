        source: "HttpResponse<String> response = Unirest.get(\"https://api.mem0.ai/api/v1/orgs/organizations/\")\n  .header(\"Authorization\", \"Token <api-key>\")\n  .asString();"
    post:
      tags:
      - organizations
      description: Create a new organization.
      operationId: create_organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the new organization.
              required:
              - name
      responses:
        '201':
          description: Successfully created a new organization.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Organization created successfully.
                  org_id:
                    type: string
                    format: uuid
                    description: Unique identifier for the organization.
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    description: Errors found in the payload.
                    additionalProperties:
                      type: array
                      items:
                        type: string
