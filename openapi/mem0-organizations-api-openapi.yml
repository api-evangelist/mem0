  /api/v1/orgs/organizations/{org_id}/:
    get:
      tags:
      - organizations
      description: Get a organization.
      operationId: get_organization
      parameters:
      - name: org_id
        in: path
        required: true
        description: The unique identifier of the organization
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the organization.
                  org_id:
                    type: string
                    description: Unique organization ID
                  name:
                    type: string
                    description: Name of the organization.
                  description:
                    type: string
                    description: Description of the organization
                  address:
                    type: string
                    description: Address of the organization
                  contact_email:
                    type: string
                    format: email
                    description: Contact email for the organization
                  phone_number:
                    type: string
                    description: Phone number of the organization
                  website:
                    type: string
                    format: uri
                    description: Website of the organization
                  on_paid_plan:
                    type: boolean
                    description: Indicates if the organization is on a paid plan
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp of when the organization was created.
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp of when the organization was last updated.
                  owner:
                    type: integer
                    description: Identifier of the organization's owner
                  members:
                    type: array
                    items:
                      type: integer
                    description: List of member identifiers belonging to the organization.
        '404':
          description: Organization not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Organization not found
