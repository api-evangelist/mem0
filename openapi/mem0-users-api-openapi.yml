openapi: 3.2.0
info:
  title: Mem0 API Docs Users API
  description: mem0.ai API Docs
  contact:
    email: support@mem0.ai
  license:
    name: Apache 2.0
  version: v1
servers:
- url: https://api.mem0.ai/
security:
- ApiKeyAuth: []
tags:
- name: Users
paths:
  /v1/users/:
    post:
      tags:
      - Users
      description: Create a new User.
      operationId: users_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
        required: true
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      x-codegen-request-body-name: data
      summary: Users create
      x-summary-source: derived
components:
  schemas:
    UserResponse:
      type: object
      description: Response returned after creating a User.
      properties:
        id:
          title: Id
          type: integer
          description: Internal numeric identifier.
        user_id:
          title: User id
          type: string
        metadata:
          title: Metadata
          type: object
          properties: {}
        created_at:
          title: Created at
          type: string
          format: date-time
        updated_at:
          title: Updated at
          type: string
          format: date-time
        graph_entities:
          title: Graph entities
          description: Graph entities linked to this record, if any.
        is_deleted:
          title: Is deleted
          type: boolean
        project:
          title: Project
          type: integer
          description: Internal numeric identifier of the project this record belongs to.
    CreateUser:
      required:
      - user_id
      type: object
      properties:
        user_id:
          title: User id
          minLength: 1
          type: string
        metadata:
          title: Metadata
          type: object
          properties: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication. Prefix your Mem0 API key with ''Token ''. Example: ''Token your_api_key'''
x-original-swagger-version: '2.0'
