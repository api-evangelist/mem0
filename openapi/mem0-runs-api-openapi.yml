paths:
  /v1/runs/:
    post:
      tags:
      - Runs
      description: Create a new Agent Run.
      operationId: runs_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRun'
        required: true
      responses:
        '201':
          description: Run created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRun'
      x-codegen-request-body-name: data
      summary: Runs create
      x-summary-source: derived
components:
  schemas:
    CreateRun:
      required:
      - run_id
      type: object
      properties:
        run_id:
          title: Run id
          minLength: 1
          type: string
        name:
          title: Name
          minLength: 1
          type: string
        metadata:
          title: Metadata
          type: object
          properties: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication. Prefix your Mem0 API key with ''Token ''. Example: ''Token your_api_key'''
